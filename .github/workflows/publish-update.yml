name: Publish authenticated update

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        required: true
        type: choice
        default: pilot
        options:
          - internal
          - pilot
          - stable
      rollout_percent:
        description: Eligible installation percentage
        required: true
        default: "100"
      mandatory:
        description: Mark the signed offer as mandatory
        required: true
        type: boolean
        default: false
      initialize_empty_repository:
        description: One-time ceremony for the first publication only
        required: true
        type: boolean
        default: false
      policy_only:
        description: Reuse authenticated packages and only expand signed rollout policy
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: trigopdv-update-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    steps:
      - name: Checkout protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce protected immutable source
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') { throw 'Only protected main may publish updates.' }
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') { throw 'The checked out source is not the dispatched commit.' }

      - name: Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Test and source gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q config db integrations printing runtime services ui updates tests tools main.py init_db.py desktop_controller.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release_gate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate independent continuity ledger
        id: continuity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = gh api "repos/${{ github.repository }}/actions/workflows/publish-update.yml/runs?status=success&branch=main&per_page=30" | ConvertFrom-Json
          foreach ($run in $runs.workflow_runs) {
            if ([string]$run.id -eq '${{ github.run_id }}') { continue }
            $artifacts = gh api "repos/${{ github.repository }}/actions/runs/$($run.id)/artifacts?per_page=100" | ConvertFrom-Json
            $ledger = @($artifacts.artifacts | Where-Object { $_.name -eq 'trigopdv-tuf-continuity' -and -not $_.expired })
            if ($ledger.Count -gt 0) {
              "run_id=$($run.id)" >> $env:GITHUB_OUTPUT
              exit 0
            }
          }
          "run_id=" >> $env:GITHUB_OUTPUT

      - name: Download independent continuity ledger
        if: steps.continuity.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trigopdv-tuf-continuity
          path: _continuity
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.continuity.outputs.run_id }}

      - name: Install exact Velopack CLI
        if: github.event_name != 'schedule' && inputs.policy_only != true
        shell: pwsh
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Build the onedir application
        if: github.event_name != 'schedule' && inputs.policy_only != true
        shell: cmd
        run: build_release.bat

      - name: Build and verify TUF repository
        shell: pwsh
        env:
          TRIGOPDV_TUF_TARGETS_KEY: ${{ secrets.TRIGOPDV_TUF_TARGETS_KEY }}
          TRIGOPDV_TUF_SNAPSHOT_KEY: ${{ secrets.TRIGOPDV_TUF_SNAPSHOT_KEY }}
          TRIGOPDV_TUF_TIMESTAMP_KEY: ${{ secrets.TRIGOPDV_TUF_TIMESTAMP_KEY }}
          UPDATE_CHANNEL: ${{ inputs.channel || 'pilot' }}
          UPDATE_ROLLOUT: ${{ inputs.rollout_percent || '100' }}
          UPDATE_MANDATORY: ${{ inputs.mandatory || 'false' }}
          INITIALIZE_EMPTY: ${{ inputs.initialize_empty_repository || 'false' }}
          SCHEDULED_REFRESH: ${{ github.event_name == 'schedule' }}
          POLICY_ONLY: ${{ inputs.policy_only || 'false' }}
        run: |
          $arguments = @("tools/build_online_release.py")
          if (Test-Path -LiteralPath '_continuity/checkpoint.json' -PathType Leaf) {
            $arguments += @("--continuity-checkpoint", "_continuity/checkpoint.json")
          }
          if ($env:SCHEDULED_REFRESH -eq "true") {
            $arguments += "--refresh-only"
          } else {
            $arguments += @(
              "--channel", $env:UPDATE_CHANNEL,
              "--rollout", $env:UPDATE_ROLLOUT,
              "--seed", "trigopdv-$env:UPDATE_CHANNEL"
            )
            if ($env:UPDATE_MANDATORY -eq "true") { $arguments += "--mandatory" }
            if ($env:INITIALIZE_EMPTY -eq "true") { $arguments += "--initialize-empty" }
            if ($env:POLICY_ONLY -eq "true") { $arguments += "--policy-only" }
          }
          python @arguments

      - name: Upload verified static repository
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trigopdv-update-site
          path: _site
          if-no-files-found: error
          retention-days: 30

      - name: Upload continuity candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trigopdv-tuf-continuity-candidate
          path: _continuity-next/checkpoint.json
          if-no-files-found: error
          retention-days: 30

      - name: Stage verified USB bootstrap
        if: github.event_name != 'schedule' && inputs.policy_only != true
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem -LiteralPath release/velopack -Filter '*Setup*.exe' -File)
          if ($setups.Count -ne 1) { throw 'Expected exactly one Velopack Setup.' }
          python tools/stage_usb_installer.py --source TrigoPDV_Instalacao_PenDrive --setup $setups[0].FullName --output _usb_stage

      - name: Upload verified USB bootstrap
        if: github.event_name != 'schedule' && inputs.policy_only != true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trigopdv-usb-package
          path: _usb_stage
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python 3.13 for continuity verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install locked verifier dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Download verified repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trigopdv-update-site
          path: _site

      - name: Download continuity candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trigopdv-tuf-continuity-candidate
          path: _continuity-next

      - name: Locate latest committed continuity ledger
        id: committed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in $(gh api "repos/${{ github.repository }}/actions/workflows/publish-update.yml/runs?status=success&branch=main&per_page=30" --jq '.workflow_runs[].id'); do
            if [ "$run_id" = "${{ github.run_id }}" ]; then continue; fi
            artifact_id=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "trigopdv-tuf-continuity" and (.expired | not)) | .id' | head -n 1)
            if [ -n "$artifact_id" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "run_id=" >> "$GITHUB_OUTPUT"

      - name: Download latest committed continuity ledger
        if: steps.committed.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trigopdv-tuf-continuity
          path: _continuity-live
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.committed.outputs.run_id }}

      - name: Revalidate continuity immediately before deploy
        id: deploy_gate
        shell: bash
        run: |
          args=(tools/check_update_deployment.py --candidate _continuity-next/checkpoint.json)
          if [ -f _continuity-live/checkpoint.json ]; then
            args+=(--committed _continuity-live/checkpoint.json)
          fi
          if [ '${{ inputs.initialize_empty_repository || false }}' = 'true' ]; then
            args+=(--allow-empty)
          fi
          status=$(python "${args[@]}")
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: steps.deploy_gate.outputs.status == 'deploy'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Package Pages artifact
        if: steps.deploy_gate.outputs.status == 'deploy'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy atomically
        if: steps.deploy_gate.outputs.status == 'deploy'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Commit independent continuity ledger
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trigopdv-tuf-continuity
          path: _continuity-next/checkpoint.json
          if-no-files-found: error
          retention-days: 90
