name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências bloqueadas
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Testes
        run: python -m unittest discover -s tests -q

      - name: Compilação da fonte
        run: >-
          python -m compileall -q config db integrations printing runtime
          services ui updates tests tools main.py init_db.py desktop_controller.py

      - name: Gate de fonte
        run: python tools/release_gate.py
