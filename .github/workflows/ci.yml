name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências bloqueadas
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Testes
        run: python -m unittest discover -s tests -q

      - name: Compilação da fonte
        run: >-
          python -m compileall -q config db integrations printing runtime
          services ui updates tests tools main.py init_db.py desktop_controller.py

      - name: Gate de fonte
        run: python tools/release_gate.py
